# ePassyar — nginx site config
#
# Install to /etc/nginx/sites-available/epassyar and symlink into sites-enabled.
# The limit_req_zone directives below belong to the http{} context, which is
# where sites-enabled/* is included from — keep them outside the server{} blocks.
#
# BEFORE FIRST START: the ssl_certificate paths below must exist. Run
#   sudo certbot --nginx -d epassyar.com -d www.epassyar.com
# which obtains the certificates and points these paths at them. nginx refuses
# to start with an ssl listener and no certificate, so do this before reloading.

# Shared memory zones for rate limiting, keyed by client IP.
# 10m holds roughly 160k addresses — ample for a municipal site.
limit_req_zone $binary_remote_addr zone=epassyar_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=epassyar_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=epassyar_general:10m rate=300r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name epassyar.com www.epassyar.com;

    # ACME renewal must stay reachable over plain http.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name epassyar.com www.epassyar.com;

    # SSL certificates — created by certbot (see the note at the top of this file).
    ssl_certificate     /etc/letsencrypt/live/epassyar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epassyar.com/privkey.pem;

    # Modern TLS only. 1.0/1.1 are long dead and 1.2+ covers every phone that can
    # run the booking flow.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Don't advertise the nginx version in responses and error pages.
    server_tokens off;

    # Upload ceiling — matches the 40 MB video limit in src/lib/upload.ts plus
    # multipart overhead.
    client_max_body_size 45M;
    client_body_timeout 60s;

    # Security headers (CSP, HSTS, nosniff, …) are set by the Next.js app in
    # next.config.mjs so there is a single source of truth. Nothing to add here.

    # Staff sign-in. The app throttles per IP *and* per account; this is the
    # cheap outer layer that never has to reach Node.
    location = /login {
        limit_req zone=epassyar_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Booking, quote and payment endpoints.
    location /api/ {
        limit_req zone=epassyar_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets served by Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=epassyar_general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

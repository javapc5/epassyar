server {
    listen 80;
    server_name epassyar.com www.epassyar.com;

    # Redirect HTTP to HTTPS (Certbot will fill this in after running certbot --nginx)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name epassyar.com www.epassyar.com;

    # SSL certificates (filled in by Certbot)
    # ssl_certificate     /etc/letsencrypt/live/epassyar.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/epassyar.com/privkey.pem;

    # Upload size limit (for photo uploads in admin)
    client_max_body_size 20M;

    # Proxy to Next.js app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets served by Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
}
